<h1>studio-analytics</h1>
<p>studio-analytics는 채널 운영자가 자신이 소유한 YouTube 채널의 성과를 확인하고 자신이 만든 영상을 업로드하기 위해 직접 실행하는 개인용 도구입니다. 일반 사용자에게 제공하는 서비스가 아닙니다.</p>
<ul>
  <li>YouTube Data API: 채널 정보와 영상 목록 조회, 운영자가 승인한 영상 업로드</li>
  <li>YouTube Analytics API · Reporting API: 채널 성과(조회수, 시청시간, 노출수 등) 조회</li>
</ul>
